<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://cloudflareinsights.com;">
<title>Bluegrass TV | Richmond &amp; Central Kentucky News, Weather, Sports</title>
<meta name="description" content="Bluegrass TV brings you local news, weather, sports, and community stories from Richmond and Central Kentucky.">
<link rel="canonical" href="https://bluegrasstransport.site/index.html">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="site-header">
  <div class="brand">
    <img src="assets/logo-bluegrasstv.png" alt="Bluegrass TV logo">
    <div class="brand-text">BLUEGRASS<span>TV</span></div>
  </div>
  <div class="datetime" id="datetime"></div>
</header>

<div class="ticker-wrap">
  <div class="ticker-label"><span class="live-dot"></span> LATEST</div>
  <div class="ticker-track-wrap">
    <div class="ticker-track" id="tickerTrack"></div>
  </div>
</div>

<nav class="tab-nav" id="tabNav">
  <button class="tab-btn active" data-tab="news">News</button>
  <button class="tab-btn" data-tab="weather">Weather</button>
  <button class="tab-btn" data-tab="sports">Sports</button>
  <button class="tab-btn" data-tab="community">Community</button>
  <a href="live.html" class="tab-btn" style="display:inline-block;">Live</a>
</nav>

<main id="main"></main>

<footer>
  Bluegrass TV &middot; Local news, weather, sports &amp; community &middot; <a href="admin.html">Newsroom Login</a>
</footer>

<script src="assets/app.js"></script>
<!--
  Site analytics: Cloudflare Web Analytics (free, no cookies, no consent
  banner needed). Sign up at https://dash.cloudflare.com -> Analytics & Logs
  -> Web Analytics -> Add a site (JS snippet mode, no DNS changes required),
  then replace YOUR_CF_BEACON_TOKEN below with the token it gives you.
  Because each story now has its own /articles/*.html page, Cloudflare's
  dashboard will show per-story pageviews out of the box.
-->
<script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "YOUR_CF_BEACON_TOKEN"}'></script>
</body>
</html>
