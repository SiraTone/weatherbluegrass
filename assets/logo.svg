<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CellScope">
  <defs>
    <radialGradient id="bg" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#10204a"/>
      <stop offset="1" stop-color="#04060c"/>
    </radialGradient>
    <linearGradient id="sw" gradientUnits="userSpaceOnUse" x1="22" y1="6" x2="54" y2="16">
      <stop offset="0" stop-color="#3fe0ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#3fe0ff" stop-opacity=".7"/>
    </linearGradient>
    <radialGradient id="cell" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff3b3b"/>
      <stop offset=".3" stop-color="#ff8a1f"/>
      <stop offset=".55" stop-color="#ffd23f"/>
      <stop offset=".8" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="scope"><circle cx="32" cy="32" r="28"/></clipPath>
  </defs>
  <style>
    .sweep{transform-origin:32px 32px;animation:spin 4s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){.sweep{animation:none}}
  </style>
  <circle cx="32" cy="32" r="30" fill="url(#bg)"/>
  <g clip-path="url(#scope)">
    <g fill="none" stroke="#3fe0ff" stroke-opacity=".28" stroke-width="1">
      <circle cx="32" cy="32" r="9.5"/>
      <circle cx="32" cy="32" r="19"/>
      <path d="M32 3v58M3 32h58"/>
    </g>
    <path d="M41 36c4-5 12-4 13 2s-3 10-8 11c-3 1-4 4-7 3s-2-4 0-5c2-1 1-3 0-4s-1-4 2-7z" fill="url(#cell)" transform="rotate(-8 46 42)"/>
    <ellipse cx="45.5" cy="42" rx="3.4" ry="2.6" fill="#ff3b3b"/>
    <ellipse cx="20" cy="22" rx="4" ry="2.6" fill="#4ade80" fill-opacity=".7" transform="rotate(-30 20 22)"/>
    <g class="sweep">
      <path d="M32 32V2A30 30 0 0 1 55.7 13.6Z" fill="url(#sw)"/>
      <path d="M32 32L55.7 13.6" stroke="#b8f4ff" stroke-width="1.6" stroke-linecap="round"/>
    </g>
  </g>
  <circle cx="32" cy="32" r="29" fill="none" stroke="#3fe0ff" stroke-width="2"/>
  <circle cx="32" cy="32" r="2.2" fill="#f2f6ff"/>
</svg>
