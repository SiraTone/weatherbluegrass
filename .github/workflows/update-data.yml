name: update-data

on:
  schedule:
    - cron: "*/10 * * * *"   # GitHub may delay scheduled runs by several minutes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch previous data (data branch)
        run: |
          git clone --depth 1 --branch data \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data-out \
            || mkdir data-out

      - name: Update data
        run: python3 scripts/update_data.py data-out

      - name: Publish data branch (single commit, history is not kept)
        run: |
          cd data-out
          rm -rf .git
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
