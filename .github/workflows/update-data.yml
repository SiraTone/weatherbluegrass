name: update-data

# Long-running job: refreshes the data every 2 minutes for about 5.5 hours, then
# starts the next run itself. The hourly schedule is only a backup in case the chain breaks.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Fetch previous data (data branch)
        run: |
          git clone --depth 1 --branch data \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data-out \
            || mkdir data-out
          rm -rf data-out/.git

      - name: Refresh loop (every 2 minutes for ~5.5 hours)
        run: |
          END=$(( $(date +%s) + 19800 ))
          while [ "$(date +%s)" -lt "$END" ]; do
            python3 scripts/update_data.py data-out || true
            rm -rf pub && cp -r data-out pub && cd pub
            git init -q -b data
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -q -m "data $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data || echo "push failed"
            cd ..
            sleep 120
          done

      - name: Start next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-data.yml -R "${{ github.repository }}" || true
