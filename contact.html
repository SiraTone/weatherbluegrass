<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — CellScope Products</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="site-header"><div class="container header-inner"><a class="brand" href="index.html"><span class="brand-badge">CS</span><span class="brand-text">CELLSCOPE <strong>PRODUCTS</strong><small>WEATHER</small></span></a><nav class="site-nav" id="siteNav"><a href="index.html">Home</a><a href="products.html">Products</a><a href="about.html">About</a><a href="contact.html" class="btn btn-sm active">Contact</a></nav><button class="nav-toggle" id="navToggle" aria-label="Toggle menu">☰</button></div></header>
<main class="container narrow">
<p class="eyebrow">Contact</p>
<h1>Request a render</h1>
<p class="lede">DM <a href="https://x.com/CellScopeRadar">@CellScopeRadar</a> or email <a href="mailto:hello@cellscope.example">hello@cellscope.example</a>. We reply within 1–2 business days.</p>
<form id="contactForm" class="card form">
<label>Name<input name="name" required placeholder="Your name"></label>
<label>Email<input name="email" type="email" required placeholder="you@example.com"></label>
<label>Product<select name="topic"><option>3D Storm Visualization</option><option>3D Weather Graphs (broadcast)</option><option>CS1.0 — Weather AI Model</option><option>CellScope Radar app</option><option>General / waitlist</option></select></label>
<label>Location / dates<textarea name="message" rows="5" required placeholder="e.g. 38.96N 98.00W, SEP 26-28"></textarea></label>
<button class="btn" type="submit">Send via email</button>
<p class="form-note" id="formNote"></p>
</form>
</main>
<footer class="site-footer"><div class="container footer-inner"><span>© <span id="year"></span> CellScope Products • <a href="https://x.com/CellScopeRadar">@CellScopeRadar</a></span><nav><a href="index.html">Home</a><a href="products.html">Products</a><a href="about.html">About</a></nav></div></footer>
<script src="assets/app.js"></script>
</body>
</html>
